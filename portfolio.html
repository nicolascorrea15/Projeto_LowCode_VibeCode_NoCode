<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfólio</title>
<style>
  :root{
    --bg:#ffffff; --fg:#0a0a0a; --muted:#5b6473; --border:#e6e8ec;
    --primary:#0b1f4d; --primary-fg:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1024px;margin:0 auto;padding:0 24px}
  header.site{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);z-index:10}
  header .row{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-weight:600;color:var(--primary);letter-spacing:-.01em;cursor:pointer}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;align-items:center}
  nav.tabs button{background:none;border:0;cursor:pointer;color:var(--muted);
    padding:6px 12px;border-radius:8px;font:inherit;font-size:14px}
  nav.tabs button:hover{color:var(--fg);background:#f1f3f6}
  nav.tabs button.active{background:var(--primary);color:var(--primary-fg)}
  .edit-btn{font-size:12px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;
    background:var(--bg);cursor:pointer;color:var(--muted)}
  .edit-btn:hover{color:var(--fg)}
  main{padding:56px 0}
  section{display:none}
  section.active{display:block}
  .kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  h1{font-size:clamp(36px,5vw,56px);line-height:1.05;letter-spacing:-.02em;margin:0 0 20px}
  h2.page{font-size:36px;letter-spacing:-.02em;margin:0 0 12px}
  p.lead{font-size:18px;color:var(--muted);line-height:1.6;max-width:640px;margin:0 0 24px}
  .grid2{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px}
  @media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
  .card{border:1px solid var(--border);border-radius:10px;padding:24px}
  .card h3{margin:0 0 8px;color:var(--primary);font-size:14px;font-weight:600}
  .card p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .btn{padding:10px 18px;border-radius:8px;font-size:14px;border:1px solid var(--border);cursor:pointer;background:var(--bg);font:inherit}
  .btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
  .section-label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px;display:flex;justify-content:space-between;align-items:center}
  article.proj{border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:16px;position:relative}
  article.proj .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:12px}
  article.proj h3{margin:0;font-size:18px}
  article.proj .meta{font-size:12px;color:var(--primary)}
  article.proj p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-size:12px;padding:3px 10px;border-radius:6px;background:#f1f3f6;color:var(--muted)}
  ul.contacts{list-style:none;padding:0;margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-width:560px}
  ul.contacts li{position:relative}
  ul.contacts li + li{border-top:1px solid var(--border)}
  ul.contacts a{display:flex;align-items:center;gap:16px;padding:18px 20px}
  ul.contacts a:hover{background:#f7f8fa}
  ul.contacts .ico{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
  ul.contacts .lbl{font-size:14px;font-weight:500}
  ul.contacts .val{font-size:13px;color:var(--muted)}
  ul.contacts .arrow{margin-left:auto;color:var(--muted)}
  footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:12px;margin-top:64px}
  .empty{color:var(--muted);font-size:14px;font-style:italic}

  /* editor */
  [contenteditable="true"]{outline:2px dashed #0b1f4d;outline-offset:4px;border-radius:4px;background:#f9fafb}
  .item-actions{display:flex;gap:6px;margin-top:10px}
  .item-actions button, .row-actions button{font-size:12px;padding:4px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--bg);cursor:pointer;font:inherit}
  .row-actions{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
  .add-btn{margin-top:8px;font-size:13px;padding:8px 14px;border:1px dashed var(--border);
    border-radius:8px;background:none;cursor:pointer;color:var(--muted);width:100%;font:inherit}
  .add-btn:hover{color:var(--fg);border-color:var(--primary)}
  .editable-field{display:block}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:#fff;padding:28px;border-radius:12px;max-width:380px;width:90%}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .modal input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    font:inherit;font-size:14px;margin-bottom:12px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end}
  .badge{font-size:11px;background:#0b1f4d;color:#fff;padding:2px 8px;border-radius:4px;margin-left:6px}
  .field-row{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:start;margin-bottom:8px;font-size:14px}
  .field-row label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding-top:8px}
  .field-row input, .field-row textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;font-size:14px}
  .field-row textarea{min-height:80px;resize:vertical}
</style>
</head>
<body>

<header class="site">
  <div class="wrap row">
    <a class="brand" data-tab="home">Portfólio</a>
    <nav class="tabs">
      <button data-tab="home" class="active">Início</button>
      <button data-tab="academico">Acadêmico</button>
      <button data-tab="pessoal">Pessoal</button>
      <button data-tab="contato">Contato</button>
      <button id="editorBtn" class="edit-btn">Editor</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <section id="home" class="active"></section>
  <section id="academico"></section>
  <section id="pessoal"></section>
  <section id="contato"></section>

</main>

<footer>
  <div class="wrap">© <span id="y"></span> — Portfólio acadêmico</div>
</footer>

<div class="modal" id="loginModal">
  <div class="box">
    <h3>Modo editor</h3>
    <p>Digite a senha para editar o portfólio. As alterações ficam salvas neste navegador.</p>
    <input type="password" id="pwInput" placeholder="senha" />
    <div class="actions">
      <button class="btn" onclick="closeLogin()">Cancelar</button>
      <button class="btn primary" onclick="tryLogin()">Entrar</button>
    </div>
    <p style="font-size:12px;margin-top:14px">Senha padrão: <code>admin</code> — altere no código (variável <code>EDIT_PASSWORD</code>).</p>
  </div>
</div>

<script>
const EDIT_PASSWORD = "admin"; // <- altere aqui
const STORAGE_KEY = "portfolio_data_v1";

const DEFAULTS = {
  home: {
    kicker: "Estudante · Ciência da Computação",
    name: "João da Silva Oliveira",
    bio: "Estudante apaixonado por desenvolvimento de software, com foco em construir sistemas claros, acessíveis e bem projetados.",
    current: "Pesquisando arquitetura de aplicações web modernas e contribuindo em projetos open source durante a graduação.",
    ambitions: "Atuar como engenheiro de software em equipes que valorizam qualidade técnica, mentoria e impacto real para os usuários."
  },
  academic: [],
  personal: [],
  collabs: [],
  contacts: [
    { label:"GitHub", value:"github.com/seu-usuario", href:"https://github.com/" },
    { label:"LinkedIn", value:"linkedin.com/in/seu-perfil", href:"https://linkedin.com/" },
    { label:"Email", value:"seu@email.com", href:"mailto:seu@email.com" }
  ]
};

let state = load();
let editMode = sessionStorage.getItem("portfolio_edit") === "1";

function load(){
  try{ const s = localStorage.getItem(STORAGE_KEY);
    if(s) return {...DEFAULTS, ...JSON.parse(s)};
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function iconFor(label){
  const k=(label||"").toLowerCase();
  if(k.includes("git")) return "GH";
  if(k.includes("linked")) return "in";
  if(k.includes("mail")||k.includes("email")) return "@";
  return "↗";
}

/* ---------- rendering ---------- */
function render(){
  renderHome();
  renderList("academico", "academic", "Projetos acadêmicos", "Faculdade",
    "Trabalhos desenvolvidos durante as disciplinas da graduação.",
    [{k:"title",l:"Título"},{k:"course",l:"Disciplina"},{k:"semester",l:"Semestre"},{k:"description",l:"Descrição",ta:true}],
    {title:"",course:"",semester:"",description:"",tech:[]});
  renderPessoal();
  renderContato();
  document.getElementById("editorBtn").textContent = editMode ? "Sair do editor" : "Editor";
}

function renderHome(){
  const c = state.home;
  const el = document.getElementById("home");
  if(editMode){
    el.innerHTML = `
      <p class="kicker"><span contenteditable="true" data-bind="home.kicker">${esc(c.kicker)}</span></p>
      <h1><span contenteditable="true" data-bind="home.name">${esc(c.name)}</span></h1>
      <p class="lead"><span contenteditable="true" data-bind="home.bio">${esc(c.bio)}</span></p>
      <div class="grid2">
        <div class="card"><h3>Trabalho atual</h3><p contenteditable="true" data-bind="home.current">${esc(c.current)}</p></div>
        <div class="card"><h3>Ambições</h3><p contenteditable="true" data-bind="home.ambitions">${esc(c.ambitions)}</p></div>
      </div>`;
  } else {
    el.innerHTML = `
      <p class="kicker">${esc(c.kicker)}</p>
      <h1>${esc(c.name)}</h1>
      <p class="lead">${esc(c.bio)}</p>
      <div class="grid2">
        <div class="card"><h3>Trabalho atual</h3><p>${esc(c.current)}</p></div>
        <div class="card"><h3>Ambições</h3><p>${esc(c.ambitions)}</p></div>
      </div>
      <div class="btns">
        <button class="btn primary" data-tab="academico">Ver projetos</button>
        <button class="btn" data-tab="contato">Entrar em contato</button>
      </div>`;
  }
  bindEditables(el);
  bindTabs(el);
}

function projectCard(p, fields){
  const meta = p.course ? `${esc(p.course)}${p.semester?" · "+esc(p.semester):""}` : (p.role?esc(p.role):"");
  return `<article class="proj">
    <div class="head"><h3>${esc(p.title)}</h3><span class="meta">${meta}</span></div>
    <p>${esc(p.description)}</p>
    <div class="tags">${(p.tech||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
  </article>`;
}

function projectEditor(p, idx, key, fields){
  return `<article class="proj">
    ${fields.map(f=>`<div class="field-row"><label>${f.l}</label>${
      f.ta ? `<textarea data-listfield="${key}|${idx}|${f.k}">${esc(p[f.k]||"")}</textarea>`
           : `<input data-listfield="${key}|${idx}|${f.k}" value="${esc(p[f.k]||"")}" />`
    }</div>`).join("")}
    <div class="field-row"><label>Tecnologias</label><input data-listfield="${key}|${idx}|tech" value="${esc((p.tech||[]).join(", "))}" placeholder="separadas por vírgula" /></div>
    <div class="item-actions"><button onclick="removeItem('${key}',${idx})">Remover</button></div>
  </article>`;
}

function renderList(sectionId, key, title, kicker, lead, fields, template){
  const el = document.getElementById(sectionId);
  const items = state[key] || [];
  const list = items.length
    ? items.map((p,i)=> editMode ? projectEditor(p,i,key,fields) : projectCard(p,fields)).join("")
    : (editMode ? "" : `<p class="empty">Nenhum projeto adicionado ainda.</p>`);
  el.innerHTML = `
    <p class="kicker">${esc(kicker)}</p>
    <h2 class="page">${esc(title)}</h2>
    <p class="lead">${esc(lead)}</p>
    ${list}
    ${editMode ? `<button class="add-btn" onclick='addItem("${key}", ${JSON.stringify(template)})'>+ Adicionar</button>`:""}
  `;
  bindListFields(el);
  bindTabs(el);
}

function renderPessoal(){
  const el = document.getElementById("pessoal");
  const fields = [{k:"title",l:"Título"},{k:"role",l:"Papel"},{k:"description",l:"Descrição",ta:true}];
  const renderGroup = (key, label, template) => {
    const items = state[key] || [];
    const inner = items.length
      ? items.map((p,i)=> editMode ? projectEditor(p,i,key,fields) : projectCard(p,fields)).join("")
      : (editMode ? "" : `<p class="empty">Nenhum item adicionado ainda.</p>`);
    return `<div class="section-label">${label}</div>${inner}${
      editMode ? `<button class="add-btn" onclick='addItem("${key}", ${JSON.stringify(template)})'>+ Adicionar</button>`:""}`;
  };
  el.innerHTML = `
    <p class="kicker">Fora da sala de aula</p>
    <h2 class="page">Projetos pessoais & colaborações</h2>
    ${renderGroup("personal","Projetos pessoais",{title:"",role:"Autor",description:"",tech:[]})}
    ${renderGroup("collabs","Colaborações",{title:"",role:"Contribuidor",description:"",tech:[]})}
  `;
  bindListFields(el);
}

function renderContato(){
  const el = document.getElementById("contato");
  const items = state.contacts || [];
  const list = editMode
    ? items.map((c,i)=>`<article class="proj">
        <div class="field-row"><label>Rótulo</label><input data-listfield="contacts|${i}|label" value="${esc(c.label)}"/></div>
        <div class="field-row"><label>Texto</label><input data-listfield="contacts|${i}|value" value="${esc(c.value)}"/></div>
        <div class="field-row"><label>URL</label><input data-listfield="contacts|${i}|href" value="${esc(c.href)}"/></div>
        <div class="item-actions"><button onclick="removeItem('contacts',${i})">Remover</button></div>
      </article>`).join("")
    : `<ul class="contacts">${items.map(c=>`
        <li><a href="${esc(c.href)}" target="_blank" rel="noreferrer">
          <span class="ico">${esc(iconFor(c.label))}</span>
          <span><div class="lbl">${esc(c.label)}</div><div class="val">${esc(c.value)}</div></span>
          <span class="arrow">↗</span>
        </a></li>`).join("")}</ul>`;
  el.innerHTML = `
    <p class="kicker">Conversar</p>
    <h2 class="page">Contato</h2>
    <p class="lead">Disponível para conversas sobre projetos acadêmicos, oportunidades e colaborações.</p>
    ${list}
    ${editMode ? `<button class="add-btn" onclick='addItem("contacts",{"label":"","value":"","href":""})'>+ Adicionar</button>`:""}
  `;
  bindListFields(el);
}

/* ---------- editing helpers ---------- */
function bindEditables(root){
  root.querySelectorAll("[data-bind]").forEach(n=>{
    n.addEventListener("blur", ()=>{
      const path = n.dataset.bind.split(".");
      let o = state; for(let i=0;i<path.length-1;i++) o = o[path[i]];
      o[path[path.length-1]] = n.innerText.trim();
      save();
    });
  });
}
function bindListFields(root){
  root.querySelectorAll("[data-listfield]").forEach(n=>{
    n.addEventListener("input", ()=>{
      const [key,idx,field] = n.dataset.listfield.split("|");
      const item = state[key][+idx];
      if(field === "tech") item.tech = n.value.split(",").map(s=>s.trim()).filter(Boolean);
      else item[field] = n.value;
      save();
    });
  });
}
function addItem(key, template){
  state[key] = state[key] || [];
  state[key].push(JSON.parse(JSON.stringify(template)));
  save(); render();
}
function removeItem(key, idx){
  state[key].splice(idx,1); save(); render();
}

/* ---------- tabs ---------- */
function bindTabs(root){
  root.querySelectorAll("[data-tab]").forEach(t=>{
    t.addEventListener("click", e=>{
      e.preventDefault();
      activateTab(t.dataset.tab);
    });
  });
}
function activateTab(id){
  document.querySelectorAll("main > section").forEach(s=>s.classList.toggle("active", s.id===id));
  document.querySelectorAll("nav.tabs button[data-tab]").forEach(b=>b.classList.toggle("active", b.dataset.tab===id));
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("nav.tabs button[data-tab], .brand").forEach(b=>{
  b.addEventListener("click", e=>{ e.preventDefault(); activateTab(b.dataset.tab); });
});

/* ---------- login ---------- */
document.getElementById("editorBtn").onclick = ()=>{
  if(editMode){ editMode=false; sessionStorage.removeItem("portfolio_edit"); render(); }
  else { document.getElementById("loginModal").classList.add("show"); document.getElementById("pwInput").focus(); }
};
function closeLogin(){ document.getElementById("loginModal").classList.remove("show"); document.getElementById("pwInput").value=""; }
function tryLogin(){
  if(document.getElementById("pwInput").value === EDIT_PASSWORD){
    editMode = true; sessionStorage.setItem("portfolio_edit","1");
    closeLogin(); render();
  } else { alert("Senha incorreta"); }
}
document.getElementById("pwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });

document.getElementById("y").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
